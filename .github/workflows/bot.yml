name: Bot paper trading

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 heures
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation
        run: pip install requests

      - name: Lancement du bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python bot.py

      - name: Sauvegarde des résultats
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data RAPPORT.md
          git commit -m "Run $(date -u +%F_%H%M)" || echo "Rien de nouveau"
          git push
