name: Bot paper trading

on:
  schedule:
    - cron: "17 * * * *"     # toutes les heures (GitHub en saute parfois)
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation
        run: pip install requests

      - name: Lancement du bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          USE_GOOGLE_SEARCH: "0"
        run: python bot.py

      - name: Sauvegarde des résultats
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data RAPPORT.md
          git commit -m "Run $(date -u +%F_%H%M)" || echo "Rien de nouveau"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            echo "Push raté, nouvel essai..."
            sleep 5
          done
